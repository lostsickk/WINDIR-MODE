name: Build WINDIR MODE dylib

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install dpkg ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone https://github.com/theos/sdks.git "$HOME/theos/sdks"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Compile WINDIR MODE
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Collect dylib
        run: |
          mkdir -p output
          find .theos -type f -name "*.dylib" -exec cp {} output/ \;
          ls -la output
          test -n "$(find output -name "*.dylib" -print -quit)"

      - name: Upload compiled files
        uses: actions/upload-artifact@v4
        with:
          name: WINDIRMODE-dylib
          path: output/*.dylib
          if-no-files-found: error
